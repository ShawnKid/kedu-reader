[package]
name = "kedu-reader"
version = "0.1.0"
edition = "2021"
description = "苛读 — 本地优先的桌面电子书阅读器"
license = "MIT"

[lib]
# 与 bin 目标（kedu-reader）区分开，避免 release 下 PDB 产物名冲突警告
name = "kedu_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
# 双击系统文件再启动时：把路径转发给已运行实例，避免多开
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
zip = "2"
quick-xml = "0.37"
regex = "1"
base64 = "0.22"
percent-encoding = "2"
encoding_rs = "0.8"
chardetng = "0.1"
memmap2 = "0.9"
ammonia = "4"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
chrono = "0.4"
# 仅用于读字体 name 表（正文字体枚举），纯 Rust 零依赖
ttf-parser = "0.25"

# Windows 发布优化：体积 + 性能（Q：可执行文件优化）
[profile.release]
opt-level = 3          # 最高运行时性能
lto = "thin"           # 跨 crate 链接时优化，减体积提速
codegen-units = 1      # 单编译单元，优化更彻底（牺牲编译时间）
strip = "symbols"      # 剥离调试符号，显著减小 exe 体积
panic = "abort"        # 阅读器无需 unwind，进一步减体积
