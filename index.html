<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>苛读</title>
</head>
<body data-theme="light">
  <!-- 拖拽悬停遮罩 -->
  <div id="drop-overlay" class="hidden"><div class="drop-hint">松开加入书架</div></div>

  <!-- 顶栏（自制标题栏：空白处可拖拽移动窗口，双击最大化/还原） -->
  <header id="topbar" data-tauri-drag-region>
    <span id="app-brand" data-tauri-drag-region>苛读</span>
    <button id="btn-shelf" class="tb-btn icon-btn" title="书架">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
    </button>
    <button id="btn-toc" class="tb-btn icon-btn reader-only" title="目录">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/></svg>
    </button>
    <button id="btn-mode" class="tb-btn icon-btn reader-only" title="切换滚动/分页">
      <svg class="ic-scroll" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 12h18"/></svg>
      <svg class="ic-page hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16"/></svg>
    </button>
    <button id="btn-settings" class="tb-btn icon-btn reader-only" title="阅读设置">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><line x1="21" x2="14" y1="4" y2="4"/><line x1="10" x2="3" y1="4" y2="4"/><line x1="21" x2="12" y1="12" y2="12"/><line x1="8" x2="3" y1="12" y2="12"/><line x1="21" x2="16" y1="20" y2="20"/><line x1="12" x2="3" y1="20" y2="20"/><line x1="14" x2="14" y1="2" y2="6"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="16" x2="16" y1="18" y2="22"/></svg>
    </button>
    <span id="book-title" class="book-title" data-tauri-drag-region></span>
    <span id="percent" class="percent" data-tauri-drag-region></span>
    <div class="tb-right">
      <button id="btn-search" class="tb-btn icon-btn reader-only" title="全文搜索 (Ctrl+F)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      </button>
      <button id="btn-bookmark" class="tb-btn icon-btn reader-only" title="添加当前页书签（右键正文同效）">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/><path d="M12 7v6"/><path d="M9 10h6"/></svg>
      </button>
      <button id="btn-view-bookmarks" class="tb-btn icon-btn reader-only" title="查看书签列表">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/><path d="M9 8h6"/><path d="M9 12h4"/></svg>
      </button>
      <button id="btn-notes" class="tb-btn icon-btn reader-only" title="查看笔记列表">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6"/><path d="M9 12h6"/><path d="M9 16h4"/></svg>
      </button>
      <button id="btn-pdf-fit" class="tb-btn tb-text pdf-only" style="display:none" title="缩放：整页完整显示在窗口内">适合页面</button>
      <button id="btn-pdf-actual" class="tb-btn tb-text pdf-only" style="display:none" title="缩放：实际大小 (100%)">实际大小</button>
      <button id="btn-more" class="tb-btn icon-btn hidden" title="更多">
        <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
      </button>
    </div>
    <div id="win-controls">
      <button id="win-min" class="win-btn" title="最小化">
        <svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 5h10" stroke="currentColor" stroke-width="1"/></svg>
      </button>
      <button id="win-max" class="win-btn" title="最大化/还原">
        <svg class="ic-max" width="10" height="10" viewBox="0 0 10 10"><rect x="0.5" y="0.5" width="9" height="9" fill="none" stroke="currentColor"/></svg>
        <svg class="ic-restore hidden" width="10" height="10" viewBox="0 0 10 10"><rect x="0.5" y="2.5" width="7" height="7" fill="none" stroke="currentColor"/><path d="M2.5 2.5v-2h7v7h-2" fill="none" stroke="currentColor"/></svg>
      </button>
      <button id="win-close" class="win-btn close" title="关闭">
        <svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10" stroke="currentColor" stroke-width="1"/></svg>
      </button>
    </div>
    <!-- 阅读进度细条（顶栏底部，宽度由 main.ts 按当前进度写入） -->
    <div id="progress-bar" aria-hidden="true"></div>
  </header>

  <div id="layout">
    <!-- 目录侧边栏 -->
    <aside id="toc" class="hidden"><nav id="toc-list"></nav></aside>

    <!-- 阅读区 -->
    <main id="reader">
      <!-- 滚动模式容器 -->
      <div id="scroll-view" class="hidden"></div>
      <!-- 卷轴卷绕带（滚动效果=自然）：顶部 33px 的卷绕克隆舞台，DOM 序在主区之后自然覆盖其上 -->
      <div id="scroll-curl" class="hidden" aria-hidden="true"></div>
      <!-- 分页模式容器 -->
      <div id="page-viewport" class="hidden"><div id="page-host"></div></div>
      <!-- PDF 容器 -->
      <div id="pdf-view" class="hidden">
        <canvas id="pdf-canvas"></canvas>
        <div id="pdf-nav">
          <button id="pdf-prev" class="tb-btn icon-btn" title="上一页 (←)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
          </button>
          <span id="pdf-page-label"></span>
          <button id="pdf-next" class="tb-btn icon-btn" title="下一页 (→)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
          </button>
        </div>
      </div>

      <!-- 边缘翻页热区：整条左右边缘可点击翻页；箭头按钮仅悬停对应热区时浮现 -->
      <div id="page-zone-prev" class="page-zone left hidden">
        <button id="btn-prev" class="page-btn" tabindex="-1">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        </button>
      </div>
      <div id="page-zone-next" class="page-zone right hidden">
        <button id="btn-next" class="page-btn" tabindex="-1">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </div>

      <!-- 欢迎页 -->
      <div id="welcome">
        <div class="welcome-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        </div>
        <p class="welcome-title">把电子书拖进窗口，开始阅读</p>
        <p class="welcome-sub">支持 EPUB / MOBI / AZW3 / PDF / FB2 / CBZ / TXT / Markdown</p>
        <div class="welcome-actions">
          <button id="btn-welcome-import" class="tb-btn primary tb-text">导入书籍</button>
          <button id="btn-welcome-shelf" class="tb-btn tb-text">打开书架</button>
        </div>
      </div>

      <!-- 状态层 -->
      <div id="loading" class="hidden"><div class="spinner"></div><span id="loading-text">正在解析书籍…</span></div>
      <div id="error-box" class="hidden">
        <p id="error-text"></p>
        <button id="btn-retry" class="tb-btn">重新打开</button>
      </div>

      <!-- 当前位置有书签时的右上角书签旗标（半透明防挡文字） -->
      <div id="bookmark-flag" class="hidden"></div>
    </main>

    <!-- 书签/笔记侧边栏（需求 6，位于整体右侧，与目录隔开） -->
    <aside id="notes-panel" class="hidden">
      <div class="np-tabs">
        <button class="np-tab active" data-nptab="bookmarks">书签</button>
        <button class="np-tab" data-nptab="notes">笔记</button>
      </div>
      <div id="np-list"></div>
    </aside>

    <!-- 全文搜索侧边栏（仅文字书；PDF/CBZ 无搜索按钮与快捷键） -->
    <aside id="search-panel" class="hidden">
      <div class="sp-head">
        <input id="search-input" type="search" placeholder="搜索全书内容" title="全书全文搜索（Enter 跳转下一处）" />
        <button id="btn-search-close" class="tb-btn icon-btn" title="关闭 (Esc)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <div id="search-meta" class="sp-meta"></div>
      <div id="search-results"></div>
    </aside>
  </div>

  <!-- 书架视图（布局参照用户提供的参考稿） -->
  <div id="shelf-view" class="hidden">
    <aside id="shelf-sidebar">
      <div class="shelf-brand">
        <img id="shelf-logo" src="/logo/苛读.png" alt="苛读" draggable="false" />
        <span class="shelf-brand-name">苛读</span>
      </div>
      <button id="btn-shelf-import" class="shelf-add-btn" title="导入书籍">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        添加图书
      </button>
      <div class="shelf-side-head">书架</div>
      <div id="shelf-cats"></div>
      <div class="shelf-side-footer">
        <button id="btn-shelf-stats" class="shelf-footer-btn" title="阅读统计">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><line x1="12" x2="12" y1="20" y2="10"/><line x1="18" x2="18" y1="20" y2="4"/><line x1="6" x2="6" y1="20" y2="16"/></svg>
          <span>统计</span>
        </button>
        <button id="btn-shelf-settings" class="shelf-footer-btn" title="阅读设置">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><line x1="21" x2="14" y1="4" y2="4"/><line x1="10" x2="3" y1="4" y2="4"/><line x1="21" x2="12" y1="12" y2="12"/><line x1="8" x2="3" y1="12" y2="12"/><line x1="21" x2="16" y1="20" y2="20"/><line x1="12" x2="3" y1="20" y2="20"/><line x1="14" x2="14" y1="2" y2="6"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="16" x2="16" y1="18" y2="22"/></svg>
          <span>设置</span>
        </button>
      </div>
    </aside>
    <div id="shelf-main">
      <div id="shelf-header">
        <h2 id="shelf-title">全部图书<span id="shelf-count"></span></h2>
        <div id="shelf-filter-row">
          <div class="shelf-search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
            <input id="shelf-search" type="search" title="按书名/作者筛选当前书架" />
          </div>
          <button id="shelf-sort" class="shelf-sort-btn" title="排序方式">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m21 16-4 4-4-4"/><path d="M17 20V4"/><path d="m3 8 4-4 4 4"/><path d="M7 4v16"/></svg>
          </button>
        </div>
      </div>
      <div id="shelf-grid"></div>
    </div>
  </div>

  <!-- 统计视图（需求 5） -->
  <div id="stats-view" class="hidden">
    <div id="stats-head">
      <button id="btn-stats-back" class="tb-btn tb-text" title="返回书架">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px"><path d="m15 18-6-6 6-6"/></svg>
        书架
      </button>
      <h3>阅读统计</h3>
    </div>
    <div id="stats-body">
      <div id="st-cards">
        <div class="st-card"><span class="st-num" id="st-today">0</span><span class="st-label">今日</span></div>
        <div class="st-card"><span class="st-num" id="st-week">0</span><span class="st-label">本周</span></div>
        <div class="st-card"><span class="st-num" id="st-month">0</span><span class="st-label">本月</span></div>
        <div class="st-card"><span class="st-num" id="st-total">0</span><span class="st-label">累计</span></div>
        <div class="st-card"><span class="st-num" id="st-books">0</span><span class="st-label">书目</span></div>
        <div class="st-card"><span class="st-num" id="st-finished">0</span><span class="st-label">读完</span></div>
      </div>
      <div id="st-cards-habit">
        <div class="st-card"><span class="st-num" id="st-streak">0</span><span class="st-label">连续天数</span></div>
        <div class="st-card"><span class="st-num" id="st-read-days">0</span><span class="st-label">阅读天数</span></div>
        <div class="st-card"><span class="st-num" id="st-avg-daily">0</span><span class="st-label">30天日均</span></div>
        <div class="st-card"><span class="st-num" id="st-peak">0</span><span class="st-label">单日峰值</span></div>
      </div>
      <div class="st-section">
        <h4>近 365 天</h4>
        <div id="st-heatmap">
          <div id="st-heatmap-labels" aria-hidden="true"></div>
          <div id="st-chart"></div>
        </div>
      </div>
      <div id="st-duo">
        <div class="st-section">
          <h4>24 小时时段</h4>
          <div id="st-donut-wrap">
            <div id="st-donut"></div>
            <div id="st-donut-legend"></div>
          </div>
        </div>
        <div class="st-section">
          <h4>会话与速度</h4>
          <div id="st-session-cards">
            <div class="st-mini"><span class="st-mini-num" id="st-session-count">0</span><span class="st-mini-label">阅读次数</span></div>
            <div class="st-mini"><span class="st-mini-num" id="st-session-avg">0</span><span class="st-mini-label">平均单次</span></div>
            <div class="st-mini"><span class="st-mini-num" id="st-session-max">0</span><span class="st-mini-label">最长单次</span></div>
            <div class="st-mini"><span class="st-mini-num" id="st-chars-read">0</span><span class="st-mini-label">累计读字</span></div>
            <div class="st-mini"><span class="st-mini-num" id="st-speed">0</span><span class="st-mini-label">平均速度</span></div>
          </div>
        </div>
      </div>
      <div class="st-section" id="st-genres-section">
        <h4>题材分布</h4>
        <div id="st-genres"></div>
      </div>
      <div class="st-section" id="st-formats-section">
        <h4>格式分布</h4>
        <div id="st-formats"></div>
      </div>
      <div class="st-section">
        <h4>书籍时长排行</h4>
        <div id="st-top-books"></div>
      </div>
      <div id="st-notes-line"></div>
    </div>
  </div>

  <!-- 划线弹窗（需求 6）：选中文字后出现。两行：颜色 / 样式 + 操作。点颜色即按默认笔型划线 -->
  <div id="sel-popup" class="hidden">
    <div class="sp-row">
      <div class="sp-group" role="group" aria-label="划线颜色">
        <button class="sp-color" data-color="yellow" title="黄色" aria-label="黄色"></button>
        <button class="sp-color" data-color="green" title="绿色" aria-label="绿色"></button>
        <button class="sp-color" data-color="blue" title="蓝色" aria-label="蓝色"></button>
        <button class="sp-color" data-color="pink" title="粉色" aria-label="粉色"></button>
        <button class="sp-color" data-color="purple" title="紫色" aria-label="紫色"></button>
      </div>
    </div>
    <div class="sp-row">
      <div class="sp-group" role="group" aria-label="划线样式">
        <button class="sp-style" data-style="highlight" title="荧光笔" aria-label="荧光笔">
          <svg viewBox="0 0 24 24" width="18" height="18"><rect x="3" y="9.25" width="18" height="5.5" rx="2.75" fill="currentColor"/></svg>
        </button>
        <button class="sp-style" data-style="underline" title="横线" aria-label="横线">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 12.5h16"/></svg>
        </button>
        <button class="sp-style" data-style="wavy" title="波浪线" aria-label="波浪线">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12.5c1.6-2.6 3.6-2.6 5.2 0s3.6 2.6 5.2 0 3.6-2.6 5.2 0"/></svg>
        </button>
      </div>
      <span class="sp-divider"></span>
      <div class="sp-group" role="group" aria-label="操作">
        <button id="sp-note" class="tb-btn icon-btn" title="写想法" aria-label="写想法">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>
        </button>
        <button id="sp-copy" class="tb-btn icon-btn" title="复制选中文本" aria-label="复制选中文本">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect width="13" height="13" x="9" y="9" rx="2.5"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- 想法编辑弹窗（需求 6）：划线属性单行工具栏 + 想法输入 -->
  <div id="note-editor" class="hidden">
    <div id="ne-quote"></div>
    <div class="ne-toolbar">
      <div class="sp-row">
        <div class="sp-group" role="group" aria-label="划线颜色">
          <button class="sp-color" data-color="yellow" title="黄色" aria-label="黄色"></button>
          <button class="sp-color" data-color="green" title="绿色" aria-label="绿色"></button>
          <button class="sp-color" data-color="blue" title="蓝色" aria-label="蓝色"></button>
          <button class="sp-color" data-color="pink" title="粉色" aria-label="粉色"></button>
          <button class="sp-color" data-color="purple" title="紫色" aria-label="紫色"></button>
        </div>
      </div>
      <div class="sp-row">
        <div class="sp-group" role="group" aria-label="划线样式">
          <button class="sp-style" data-style="highlight" title="荧光笔" aria-label="荧光笔">
            <svg viewBox="0 0 24 24" width="18" height="18"><rect x="3" y="9.25" width="18" height="5.5" rx="2.75" fill="currentColor"/></svg>
          </button>
          <button class="sp-style" data-style="underline" title="横线" aria-label="横线">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 12.5h16"/></svg>
          </button>
          <button class="sp-style" data-style="wavy" title="波浪线" aria-label="波浪线">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12.5c1.6-2.6 3.6-2.6 5.2 0s3.6 2.6 5.2 0 3.6-2.6 5.2 0"/></svg>
